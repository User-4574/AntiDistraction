##############################################
# SQUID CONFIGURATION: lockdown
# Purpose: Transparent HTTPS proxy w/ MITM
# Policy is uniform across all LAN devices
##############################################

# --- Identity ---
visible_hostname router
#dns_v4_first on

##############################################
# PORTS
##############################################
# Transparent HTTP (redirect 80 -> 3128)
http_port 3128 intercept

# Explicit proxy listener — needs ssl-bump or ssl_bump rules are inert here
http_port 192.168.2.1:3130 ssl-bump \
    cert=/etc/squid/ssl/mitm.pem \
    generate-host-certificates=on dynamic_cert_mem_cache_size=64MB \
    tls-dh=/etc/squid/ssl/dhparam.pem

# Transparent HTTPS with SSL-Bump (redirect 443 -> 3129)
https_port 3129 intercept ssl-bump \
    cert=/etc/squid/ssl/mitm.pem \
    generate-host-certificates=on dynamic_cert_mem_cache_size=64MB \
    tls-dh=/etc/squid/ssl/dhparam.pem

# Explicit forward-proxy listener (for localhost sanity)
http_port 127.0.0.1:3127

##############################################
# SSL CERTIFICATE HELPER
##############################################
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/squid/ssl_db -M 64MB
sslcrtd_children 8 startup=1 idle=1

##############################################
# ACCESS CONTROL LISTS (ACLs)
##############################################
# Local network
acl localnet src 192.168.2.0/24
acl local_router dst 192.168.0.0/16

# Work laptop
acl work_laptop src 192.168.2.93

# SSL-Bump phases
acl step1 at_step SslBump1

##############################################
# EXPLICIT ALLOWS (spliced before any block)
##############################################
acl allow_sni ssl::server_name_regex -i \
    (^|\.)mail\.google\.com$ \
    (^|\.)voice\.google\.com$ \
    (^|\.)accounts\.google\.com$ \
    (^|\.)clients[0-9]*\.google\.com$ \
    (^|\.)apis\.google\.com$ \
    (^|\.)claude\.ai$

##############################################
# YOUTUBE BLOCK (music.youtube.com exempted)
##############################################
# Spliced before any block is evaluated
acl yt_music_sni ssl::server_name_regex -i ^music\.youtube\.com$

# Hosts killed outright at the TLS layer.
# www./m. youtube.com are NOT here — they serve the player JS that
# YouTube Music needs. They get bumped and filtered by path below.
acl yt_kill_sni ssl::server_name_regex -i \
    (^|\.)youtu\.be$ \
    (^|\.)youtube-nocookie\.com$ \
    (^|\.)youtubeeducation\.com$

# Bare hostnames (no leading dot) so music.youtube.com is not caught
acl yt_www_hosts   dstdomain youtube.com www.youtube.com m.youtube.com

# Player assets YouTube Music loads from www.youtube.com
acl yt_asset_paths urlpath_regex -i ^/s/(player|desktop|tv)/ ^/yts/

##############################################
# OTHER DISTRACTIONS
##############################################
acl all_block dstdomain .pluto.tv .peacocktv.com .netflix.com .paramountplus.com \
    .disneyplus.com .hulu.com .tiktok.com .instagram.com .cdninstagram.com \
    .pinterest.com .facebook.com

# Facebook feeds control
acl fb_hosts dstdomain .facebook.com

acl fb_root_path        urlpath_regex -i ^/$
acl fb_root_feed        urlpath_regex -i ^/feed(/)?([?#].*)?
acl fb_groups_feed_path urlpath_regex -i ^/groups(/feed)?(/)?([?#].*)?
acl fb_graphql          urlpath_regex -i ^/(api/)?graphql

##############################################
# PRIME VIDEO BLOCK
##############################################
# Block Prime Video by host (SNI + dstdomain), but allow normal Amazon retail
acl prime_video_sni ssl::server_name_regex -i \
    (^|\.)primevideo\.com$ \
    (^|\.)amazonvideo\.com$ \
    (^|\.)aiv-cdn\.net$ \
    (^|\.)aiv-delivery\.net$ \
    (^|\.)pv-cdn\.net$ \
    (^|\.)video\.a2z\.com$ \
    (^|\.)atv-ps\.amazon\.com$ \
    (^|\.)atv-ext\.amazon\.com$

acl prime_hosts dstdomain \
    .primevideo.com .amazonvideo.com .aiv-cdn.net .aiv-delivery.net \
    .pv-cdn.net .video.a2z.com .atv-ps.amazon.com .atv-ext.amazon.com

##############################################
# SPLICE LIST (cert-pinned / do-not-MITM)
##############################################
# .googlevideo.com, .ytimg.com and .ggpht.com stay here — YouTube Music
# needs all three. Safe because the /watch page itself is denied by path.
acl splice_sites ssl::server_name \
	.google.com \
	.gstatic.com \
	.googleapis.com \
	.microsoft.com \
	.live.com \
	.github.com \
	.githubusercontent.com \
	.bankofamerica.com \
	.chase.com \
	.wellsfargo.com \
	.1stnb.com \
	.ytimg.com \
	.googlevideo.com \
	.ggpht.com \
	.googleusercontent.com \
	.interactivebrokers.com \
	.apple.com \
	.mzstatic.com \
	.aaplimg.com \
	.cdn-apple.com \
	vaultwarden.justanotherdomain.us \
	.microsoftonline.com \
	.login.windows.net \
	.optimum.com \
	.msauth.net \
	.msauthimages.net \
	.msftauth.net \
	.msftauthimages.net \
	.aadcdn.microsoftonline-p.com \
	.management.azure.com \
	.ajax.aspnetcdn.com \
	.digicert.com \
	.msocsp.com \
	.symcb.com \
	.verisign.com \
	.kraken.com \
	.krakenapi.com \
	.krakenfx.com \
	.krakenassets.com \
	.snapcraft.io \
	.snapcraftcontent.com \
	.alipay.com \
	.taobao.com \
	.1688.com \
	.tenpay.com \
	.wechat.com \
	.docker.io \
	.bitwarden.com \
	.azureedge.net \
	.blob.core.windows.net \
	.servicebus.windows.net

##############################################
# SSL-BUMP POLICY
# Order is load-bearing. Evaluated top-down and restarted at each step.
##############################################
# Peek first so SNI is known for every rule below
ssl_bump peek step1

# Explicit allows win over everything
ssl_bump splice allow_sni
ssl_bump splice yt_music_sni

# Blocks — must precede splice_sites, whose .googleapis.com entry
# would otherwise splice youtubei.googleapis.com
ssl_bump terminate yt_kill_sni
ssl_bump terminate prime_video_sni

# Splices
ssl_bump splice local_router
ssl_bump splice splice_sites
ssl_bump splice work_laptop

# www./m. youtube.com fall through to here and get bumped, so the
# path rules below can see the URL
ssl_bump bump all

##############################################
# REDIRECTED DENIES / ACCESS RULES
##############################################
# Facebook redirects
deny_info https://www.facebook.com/marketplace/ fb_root_path
deny_info https://www.facebook.com/marketplace/ fb_groups_feed_path
deny_info https://www.facebook.com/marketplace/ fb_root_feed
deny_info https://www.facebook.com/marketplace/ fb_graphql

# Apply Facebook path denies
http_access deny fb_hosts fb_root_path
http_access deny fb_hosts fb_groups_feed_path
http_access deny fb_hosts fb_root_feed
http_access deny fb_hosts fb_graphql

# YouTube: allow player assets, deny everything else on those hosts.
# The allow MUST come first.
http_access allow yt_www_hosts yt_asset_paths
http_access deny  yt_www_hosts

# Prime Video by host
http_access deny prime_hosts

# Other broad distractions
http_access deny all_block

##############################################
# ACCESS RULES
##############################################
http_access allow localhost
http_access allow localnet
http_access allow local_router

# Default deny (safety)
http_access deny all

##############################################
# LOGGING
##############################################
access_log daemon:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache_store_log none
logfile_rotate 10

##############################################
# CACHE SETTINGS
##############################################
cache_mem 4096 MB
maximum_object_size_in_memory 40 MB
cache_dir ufs /var/spool/squid 15360 16 256
maximum_object_size 102400 MB

##############################################
# RUN AS PROXY USER
##############################################
cache_effective_user proxy
cache_effective_group proxy
